name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # Deliberately a plain pytest run: it exits non-zero on *collection*
      # errors, not just failures. Eight test modules were silently skipped
      # for an entire release because a renamed module made them uncollectable
      # while the suite still reported green. Never add
      # `--continue-on-collection-errors` here.
      - name: Run tests
        run: pytest -q

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Advisory for now. `pre-commit run --all-files` currently reports ~95 ruff
    # findings plus trailing-whitespace and end-of-file fixes across files this
    # branch never touched (examples/, docs/, CHANGELOG.md, .gitignore,
    # pyproject.toml). Making it blocking today would mean either a large
    # unrelated cleanup or a permanently red CI. The cleanup is tracked
    # separately; flip this to blocking once it lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
