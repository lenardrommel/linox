name: CI

on:
  push:
    # `linox003` is the current integration branch -- `main` is frozen, so
    # merges land here and would otherwise never be built. Keep `main` listed
    # so this keeps working once that changes.
    branches: [main, linox003]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # Deliberately a plain pytest run: it exits non-zero on *collection*
      # errors, not just failures. Eight test modules were silently skipped
      # for an entire release because a renamed module made them uncollectable
      # while the suite still reported green. Never add
      # `--continue-on-collection-errors` here.
      - name: Run tests
        run: pytest -q

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # `--strict` turns warnings into errors, so a broken cross-reference or an
      # API path that no longer resolves fails the build rather than shipping a
      # dead link. The examples themselves are executed by the test suite.
      - name: Build the site
        run: mkdocs build --strict

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
