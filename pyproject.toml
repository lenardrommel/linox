[project]
name = "linox"
description = "Linear operators in JAX."
readme = "README.md"
requires-python = ">=3.10"
version = "0.0.3"

authors = [
  { name = "Tobias Weber", email = "t.weber@uni-tuebingen.de" },
  { name = "Lenard Rommel", email = "lenardrommel@icloud.com" },
]

keywords = ["Linear operators", "Operators", "Matrix-free linear algebra"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

dependencies = [
  "jax",
  "plum-dispatch",
  "numpy",
  "scipy",
  "jaxtyping",
  "matplotlib",
  "tueplots",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["linox*", "helper*"]
exclude = ["site*", "tests*", "docs*"]


# Optional: keep these for "pip install linox[docs]" etc when you publish (extras are public API)
[project.optional-dependencies]
docs = ["mkdocs-material", "mkdocstrings[python]"]
# pytest is capped below 9: pytest-cases 3.10.1 (the latest) calls
# `IdMaker(...)` with pytest 8's signature and dies on pytest 9 with
# "IdMaker.__init__() takes 7 positional arguments but 8 were given",
# before collecting a single test. Lift the cap once pytest-cases supports 9.
test = [
  "pytest>=8,<9",
  "pytest-cov",
  "pytest-cases",
  "hypothesis",
  "tox-uv",
]
dev = ["pre-commit", "pyright", "jupyterlab", "isort>=7.0.0", "ruff"]

[dependency-groups]
lint = ["ruff>=0.15.0"]


test = [
  # See the note on the `test` extra above: pytest-cases does not support
  # pytest 9 yet.
  "pytest>=8,<9",
  "pytest-cov",
  "pytest-cases",
  "hypothesis",
  "tox-uv",
]

docs = [
  "mkdocs-material",
  "mkdocstrings[python]",
]

dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "docs" },
  "pre-commit",
  "pyright",
  "jupyterlab",
  "isort>=7.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 150
# pre-commit passes explicit file paths, and ruff only applies `exclude`
# during its own file discovery unless this is set. Without it the hook lints
# `tests/`, `examples/` and `helper/` despite the exclusions below.
force-exclude = true
# `examples/` are demonstration scripts and `helper/` is the GP demo package
# that ships alongside them -- neither is public API, and holding them to the
# docstring rules produced 75 findings with no reader to benefit.
exclude = ["tests", "examples", "helper"]


[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B", "SIM", "RUF"]

ignore = [
  "D107",  # Missing docstring in __init__
  "D105",  # Missing docstring in magic method
  "RUF001", # String contains ambiguous sign (×, −, Λ, ⊗ in maths notation)
  "RUF002", # Docstring contains ambiguous sign
  "RUF003", # Comment contains ambiguous sign
  "E741", # Ambiguous variable name
  "D401", # Docstring not in imperative mood
]
[tool.ruff.lint.pydocstyle]
convention = "numpy"
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "E741"]


[tool.typos.default.extend-words]
# Stochastic Lanczos Quadrature. Without this, typos "corrects" every SLQ to
# SQL -- it once renamed the module, the exports and the documented
# `method="slq"` string across 11 files.
slq = "slq"
SLQ = "SLQ"
